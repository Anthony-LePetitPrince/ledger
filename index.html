<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>我的記帳</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1b1f1d;--mut:#6b7570;--line:#e3e7e4;--pri:#0f766e;--priTx:#fff;--exp:#c2410c;--inc:#15803d;--warn:#d97706;--bad:#dc2626;--okbg:#e7f5ec;--lbg:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--card:#1c211e;--tx:#eef2ef;--mut:#99a39d;--line:#2b322e;--pri:#2dd4bf;--priTx:#06201c;--exp:#fb923c;--inc:#4ade80;--okbg:#17301f;--lbg:#33270f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 8px;z-index:5;display:flex;align-items:center;gap:8px}
header .mo{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:18px}
header .mo button{background:none;border:0;color:var(--tx);font-size:22px;padding:4px 12px;cursor:pointer}
header .ttl{font-weight:700;font-size:18px;flex:1}
.st{font-size:12px;color:var(--mut);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.st.ok{color:var(--inc)}.st.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:12px}
.sum b{font-size:18px;font-variant-numeric:tabular-nums}
.e{color:var(--exp)}.i{color:var(--inc)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.sub{border-top:0;padding:3px 0 3px 20px;font-size:13px;color:var(--mut);cursor:default}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .m{flex:1;min-width:0}
.row .m div:first-child{font-weight:500}
.row .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-variant-numeric:tabular-nums;font-weight:600}
.dh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:16px 4px 0}
.rec{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:10px}
.rec .m{flex:1;min-width:0}
.rec small{color:var(--mut);display:block}
.rec .a{font-variant-numeric:tabular-nums;font-weight:600}
.rec.done{background:var(--okbg);border-color:var(--inc)}
.rec.late{background:var(--lbg);border-color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--priTx);font-size:30px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:7}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--mut);font-size:15px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input.amt{font-size:32px;font-weight:700;text-align:right;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--pri);background:var(--pri);color:var(--priTx)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:11px;font-size:15px;cursor:pointer}
.btn.p{background:var(--pri);color:var(--priTx);border-color:var(--pri);font-weight:600}
.btn.d{color:var(--bad)}
.btn.s{flex:none;padding:6px 12px;font-size:13px}
h3{margin:0 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.gap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bi:first-of-type{border-top:0}
.bi input{width:110px;text-align:right;flex:none}
.cb{border-top:1px solid var(--line)}
.cb:first-of-type{border-top:0}
.cb .bi{border-top:0;padding-bottom:4px}
.cb .chips{margin:0 0 10px 20px}
.cb .chip{padding:3px 10px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.leg .row{cursor:default}
.lnk{cursor:pointer;color:var(--pri)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const LS='ledger_db_v1',CF='ledger_cfg_v1',FN='記帳資料.json',SCOPE='https://www.googleapis.com/auth/drive.file';
const PAL=['#0f766e','#c2410c','#2563eb','#a21caf','#ca8a04','#dc2626','#0891b2','#65a30d','#7c3aed','#db2777','#475569','#ea580c'];
const DEFSUB={'d-expense-0':['早餐','午餐','晚餐','飲料','點心'],'d-expense-1':['燃料','捷運','火車','公車','計程車','停車']};
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const WD=['日','一','二','三','四','五','六'];
const now=new Date();
const curYM=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)};

function defDB(){
  const mk=(n,t,i)=>({id:'d-'+t+'-'+i,name:n,type:t,color:PAL[i%PAL.length],u:1});
  return{v:1,
    categories:[...['餐飲','交通','購物','居家','娛樂','醫療','學習','其他'].map((n,i)=>mk(n,'expense',i)),
                ...['薪資','獎金','其他收入'].map((n,i)=>mk(n,'income',i))],
    entries:[],budgets:[],recurring:[]};
}
function migrate(d){
  d.entries=d.entries||[];d.budgets=d.budgets||[];d.recurring=d.recurring||[];
  d.categories.forEach(c=>{if(!c.subs)c.subs=(DEFSUB[c.id]||[]).slice()});
  return d;
}
let db;try{db=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){db=null}
if(!db||!db.categories)db=defDB();
migrate(db);
let cfg;try{cfg=JSON.parse(localStorage.getItem(CF)||'null')||{}}catch(e){cfg={}}
const saveCfg=()=>localStorage.setItem(CF,JSON.stringify(cfg));

let S={view:'home',ym:curYM(),statType:'expense'};
let R={unit:'month',ref:curYM(),from:'',to:''};
let token=null,tokenExp=0,tc=null,syncing=false,again=false,status='未連線',timer=null;

const cats=t=>db.categories.filter(c=>!c.d&&(!t||c.type===t));
const catById=id=>db.categories.find(c=>c.id===id)||{name:'(已刪除)',color:'#999',type:'expense',subs:[]};
const ents=()=>db.entries.filter(e=>!e.d);
const monthEnts=ym=>ents().filter(e=>e.date.startsWith(ym));
const sumBy=(l,t)=>l.filter(e=>e.type===t).reduce((a,e)=>a+e.amount,0);
function shiftYM(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+p2(m)}
function persist(){localStorage.setItem(LS,JSON.stringify(db));schedSync();render()}

/* ---------- usage ordering ---------- */
function usage(){
  const d=new Date(Date.now()-90*864e5),s=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const c={},sb={};
  ents().forEach(e=>{if(e.date<s)return;c[e.catId]=(c[e.catId]||0)+1;if(e.sub){const k=e.catId+'|'+e.sub;sb[k]=(sb[k]||0)+1}});
  return{c,sb};
}
const byUse=(arr,cnt)=>arr.map((x,i)=>[x,i]).sort((a,b)=>(cnt(b[0])-cnt(a[0]))||(a[1]-b[1])).map(x=>x[0]);

/* ---------- range ---------- */
function bounds(r){
  r=r||R;
  if(r.unit==='month'){const[y,m]=r.ref.split('-').map(Number);return{from:r.ref+'-01',to:r.ref+'-'+p2(new Date(y,m,0).getDate())}}
  if(r.unit==='year')return{from:r.ref+'-01-01',to:r.ref+'-12-31'};
  let f=r.from||today(),t=r.to||today();if(f>t){const x=f;f=t;t=x}
  return{from:f,to:t};
}
function rangeLabel(){
  if(R.unit==='month'){const[y,m]=R.ref.split('-');return y+' 年 '+Number(m)+' 月'}
  if(R.unit==='year')return R.ref+' 年';
  const b=bounds();return b.from+' ~ '+b.to;
}
function rangeEnts(){const b=bounds();return ents().filter(e=>e.date>=b.from&&e.date<=b.to)}
function presetVal(k){
  const y=now.getFullYear();
  if(k==='cur')return{unit:'month',ref:curYM()};
  if(k==='last')return{unit:'month',ref:shiftYM(curYM(),-1)};
  if(k==='year')return{unit:'year',ref:String(y)};
  if(k==='lastyear')return{unit:'year',ref:String(y-1)};
  return{unit:'custom',from:curYM()+'-01',to:today()};
}
function isPreset(k){
  if(k==='custom')return R.unit==='custom';
  const p=presetVal(k);return R.unit===p.unit&&R.ref===p.ref;
}
function setRange(k){const p=presetVal(k);R={unit:p.unit,ref:p.ref||'',from:p.from||'',to:p.to||''};render()}
function stepRange(n){
  if(R.unit==='month')R.ref=shiftYM(R.ref,n);
  else if(R.unit==='year')R.ref=String(Number(R.ref)+n);
  render();
}
function monthCount(a,b){const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return Math.max(1,(by-ay)*12+(bm-am)+1)}
function budMonths(b){
  const f=b.from.slice(0,7);let t=b.to.slice(0,7);const c=curYM();
  if(t>c)t=c;
  if(t<f)t=b.to.slice(0,7);
  return monthCount(f,t);
}
function rangeBar(){
  const items=[['cur','本月'],['last','上月'],['year','今年'],['lastyear','去年'],['custom','自訂']];
  let h='<div class="chips" style="margin-top:0">'+items.map(([k,n])=>'<button class="chip '+(isPreset(k)?'on':'')+'" onclick="setRange(\''+k+'\')">'+n+'</button>').join('')+'</div>';
  if(R.unit==='custom')h+='<div class="gap" style="margin-bottom:10px"><input type="date" value="'+R.from+'" onchange="R.from=this.value;render()"><input type="date" value="'+R.to+'" onchange="R.to=this.value;render()"></div>';
  return h;
}

/* ---------- Sync (Google Drive) ---------- */
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort()):v);
const sortId=a=>[...(a||[])].sort((x,y)=>x.id<y.id?-1:1);
const ser=d=>stable({v:1,categories:sortId(d.categories),entries:sortId(d.entries),budgets:sortId(d.budgets),recurring:sortId(d.recurring)});
function mergeList(x,y){const m=new Map();[...(x||[]),...(y||[])].forEach(i=>{const p=m.get(i.id);if(!p||(i.u||0)>(p.u||0))m.set(i.id,i)});return[...m.values()]}
const mergeDB=(a,b)=>migrate({v:1,categories:mergeList(a.categories,b.categories),entries:mergeList(a.entries,b.entries),budgets:mergeList(a.budgets,b.budgets),recurring:mergeList(a.recurring,b.recurring)});
function setStatus(s){status=s;const el=$('#st');if(el){el.textContent=s;el.className='st '+(s==='已同步'?'ok':(s==='同步失敗'||s==='需重新連線')?'bad':'')}}
function schedSync(){clearTimeout(timer);if(cfg.clientId&&cfg.authed)timer=setTimeout(()=>sync(false),1500)}
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initAuth(){
  if(!cfg.clientId)return;
  try{await loadGIS();tc=google.accounts.oauth2.initTokenClient({client_id:cfg.clientId,scope:SCOPE,callback:()=>{}})}catch(e){setStatus('離線')}
}
function requestToken(prompt){
  return new Promise((res,rej)=>{
    if(!tc)return rej(new Error('auth'));
    tc.callback=r=>{if(r.error)return rej(new Error('auth'));token=r.access_token;tokenExp=Date.now()+(r.expires_in-60)*1000;cfg.authed=1;saveCfg();res(token)};
    tc.error_callback=()=>rej(new Error('auth'));
    tc.requestAccessToken({prompt});
  });
}
async function api(url,opt){
  opt=opt||{};
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}});
  if(r.status===401){token=null;throw new Error('auth')}
  if(!r.ok){let t='';try{t=(await r.text()).replace(/\s+/g,' ').slice(0,300)}catch(e){}throw new Error('http '+r.status+' '+t)}
  return r;
}
async function sync(interactive){
  if(!cfg.clientId){return}
  if(!tc)await initAuth();
  if(syncing){again=true;return}
  syncing=true;setStatus('同步中…');
  try{
    if(!token||Date.now()>tokenExp)await requestToken(interactive?'':'none');
    let id=cfg.fileId,remote=null;
    const dl=i=>api('https://www.googleapis.com/drive/v3/files/'+i+'?alt=media').then(r=>r.json());
    if(id){try{remote=await dl(id)}catch(e){if(String(e.message).includes('404')||String(e.message).includes('403'))id=null;else throw e}}
    if(!id){
      const q=encodeURIComponent("name='"+FN+"' and trashed=false");
      const l=await(await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&orderBy='+encodeURIComponent('modifiedTime desc'))).json();
      if(l.files&&l.files.length){id=l.files[0].id;remote=await dl(id)}
    }
    if(remote&&!remote.categories)remote=null;
    if(remote)migrate(remote);
    const was=ser(db);
    const merged=remote?mergeDB(db,remote):db;
    const body=ser(merged);
    const changed=!remote||ser(remote)!==body;
    db=merged;localStorage.setItem(LS,JSON.stringify(db));
    if(!id){
      const bd='bd'+uid();
      const mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:FN,mimeType:'application/json'})+'\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+body+'\r\n--'+bd+'--';
      const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
      id=(await r.json()).id;
    }else if(changed){
      await api('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json; charset=UTF-8'},body:body});
    }
    cfg.fileId=id;cfg.last=Date.now();saveCfg();
    cfg.err='';saveCfg();setStatus('已同步');if(was!==body||interactive)render();
  }catch(e){
    cfg.err=String(e&&e.message||e).slice(0,400);saveCfg();
    setStatus(e.message==='auth'?'需重新連線':(navigator.onLine?'同步失敗':'離線'));
  }finally{syncing=false;if(again){again=false;schedSync()}}
}
function connect(){
  const v=($('#cid')||{}).value;
  if(v!==undefined){cfg.clientId=v.trim();saveCfg()}
  if(!cfg.clientId){alert('請先填入 Google OAuth Client ID');return}
  tc=null;token=null;
  initAuth().then(()=>sync(true));
}
function disconnect(){
  if(token&&window.google)try{google.accounts.oauth2.revoke(token,()=>{})}catch(e){}
  token=null;cfg.authed=0;cfg.fileId=null;saveCfg();setStatus('未連線');render();
}

/* ---------- Views ---------- */
function setView(v){S.view=v;render();window.scrollTo(0,0)}
function moveMonth(n){S.ym=shiftYM(S.ym,n);render()}
function render(){
  const v=S.view;
  let h='<header>';
  if(v==='settings')h+='<div class="ttl">設定</div>';
  else if(v==='home'){const[y,m]=S.ym.split('-');
    h+='<div class="mo"><button onclick="moveMonth(-1)">‹</button><span onclick="S.ym=curYM();render()">'+y+' 年 '+Number(m)+' 月</span><button onclick="moveMonth(1)">›</button></div>'}
  else{const hid=R.unit==='custom'?'hidden':'visible';
    h+='<div class="mo"><button style="visibility:'+hid+'" onclick="stepRange(-1)">‹</button><span>'+rangeLabel()+'</span><button style="visibility:'+hid+'" onclick="stepRange(1)">›</button></div>'}
  h+='<button class="st '+(status==='已同步'?'ok':(status==='同步失敗'||status==='需重新連線')?'bad':'')+'" id="st" onclick="sync(true)">'+esc(status)+'</button></header>';
  h+=v==='home'?viewHome():v==='stats'?viewStats():v==='budget'?viewBudget():viewSettings();
  $('#app').innerHTML=h+nav();
}
function nav(){
  const t=[['home','📒','記帳'],['stats','📊','分析'],['budget','🎯','預算'],['settings','⚙️','設定']];
  return(S.view!=='settings'?'<button class="fab" onclick="openForm()">+</button>':'')+
  '<nav><div>'+t.map(x=>'<button class="'+(S.view===x[0]?'on':'')+'" onclick="setView(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></nav>';
}
function budgetOf(id){const b=(db.budgets||[]).find(x=>x.id===id&&!x.d);return b?b.amount:0}
function barHTML(spent,bud){
  const p=bud?spent/bud:0,c=p>1?'var(--bad)':p>.8?'var(--warn)':'var(--inc)';
  return'<div class="bar"><i style="width:'+Math.min(100,p*100)+'%;background:'+c+'"></i></div>';
}
const catLabel=e=>{const c=catById(e.catId);return esc(c.name)+(e.sub?'<span class="mut"> · '+esc(e.sub)+'</span>':'')};

/* recurring */
function recDate(r,ym){const[y,m]=ym.split('-').map(Number);const dim=new Date(y,m,0).getDate();return ym+'-'+p2(Math.min(Math.max(1,Number(r.day)||1),dim))}
function recDone(r,ym){return ents().find(e=>e.rid===r.id&&e.date.startsWith(ym))}
function recCard(){
  const rs=(db.recurring||[]).filter(r=>!r.d);if(!rs.length)return'';
  const t=today();
  return'<div class="card"><h3>固定收支</h3>'+[...rs].sort((a,b)=>(a.day||0)-(b.day||0)).map(r=>{
    const d=recDate(r,S.ym),done=recDone(r,S.ym),c=catById(r.catId),late=!done&&d<=t;
    return'<div class="rec '+(done?'done':late?'late':'')+'"><div class="m"><div>'+esc(r.name)+'</div><small>'+Number(d.slice(5,7))+'/'+Number(d.slice(8))+'・'+esc(c.name)+(r.sub?'・'+esc(r.sub):'')+'</small></div><div class="a '+(r.type==='income'?'i':'e')+'">'+(r.type==='income'?'+':'-')+fmt(r.amount)+'</div><button class="btn s '+(done?'':'p')+'" onclick="toggleRec(\''+r.id+'\')">'+(done?'已記 ✓':'記一筆')+'</button></div>';
  }).join('')+'</div>';

function donut(items,total,label){
  let off=25,seg='';
  items.forEach(it=>{const p=it.v/total*100;seg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+it.c+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p});
  return'<svg viewBox="0 0 42 42" style="width:200px;height:200px;display:block;margin:0 auto"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="6"/>'+seg+'<text x="21" y="20" text-anchor="middle" font-size="3" fill="var(--mut)">'+label+'</text><text x="21" y="25" text-anchor="middle" font-size="4.2" font-weight="700" fill="var(--tx)">'+fmt(total)+'</text></svg>';
}
function trendMonths(){
  if(R.unit==='month'){const a=[];for(let i=5;i>=0;i--)a.push(shiftYM(R.ref,-i));return a}
  const b=bounds();let a=[],cur=b.from.slice(0,7);const end=b.to.slice(0,7);
  while(cur<=end&&a.length<120){a.push(cur);cur=shiftYM(cur,1)}
  return a.slice(-12);
}
function viewStats(){
  const t=S.statType,b=bounds(),es=rangeEnts().filter(e=>e.type===t);
  const total=es.reduce((a,e)=>a+e.amount,0);
  let h=rangeBar()+'<div class="seg"><button class="'+(t==='expense'?'on':'')+'" onclick="S.statType=\'expense\';render()">支出</button><button class="'+(t==='income'?'on':'')+'" onclick="S.statType=\'income\';render()">收入</button></div>';
  if(!es.length)h+='<div class="empty">這個區間沒有'+(t==='expense'?'支出':'收入')+'</div>';
  else{
    const by={},sbm={};
    es.forEach(e=>{by[e.catId]=(by[e.catId]||0)+e.amount;const m=sbm[e.catId]=sbm[e.catId]||{};const s=e.sub||'';m[s]=(m[s]||0)+e.amount});
    const items=Object.keys(by).map(id=>({id,v:by[id],c:catById(id).color,n:catById(id).name})).sort((a,b)=>b.v-a.v);
    h+='<div class="card">'+donut(items,total,t==='expense'?'總支出':'總收入')+'<div class="leg" style="margin-top:12px">'+
      items.map(i=>{
        let r='<div class="row"><span class="dot" style="background:'+i.c+'"></span><div class="m">'+esc(i.n)+'</div><div class="mut">'+(i.v/total*100).toFixed(1)+'%</div><div class="a" style="min-width:80px;text-align:right">'+fmt(i.v)+'</div></div>';
        const sk=Object.keys(sbm[i.id]);
        if(sk.length>1||(sk.length===1&&sk[0]!==''))
          r+=sk.sort((x,y)=>sbm[i.id][y]-sbm[i.id][x]).map(s=>'<div class="row sub"><div class="m">'+esc(s||'(未分子項目)')+'</div><div style="min-width:80px;text-align:right">'+fmt(sbm[i.id][s])+'</div></div>').join('');
        return r}).join('')+'</div></div>';
    const endD=b.to<today()?b.to:today();
    const days=Math.max(1,Math.round((new Date(endD)-new Date(b.from))/864e5)+1);
    const big=es.reduce((a,e)=>e.amount>a.amount?e:a,es[0]);
    h+='<div class="card"><div class="gap"><div><small class="mut">日均</small><div style="font-size:20px;font-weight:700">'+fmt(total/days)+'</div></div><div><small class="mut">筆數</small><div style="font-size:20px;font-weight:700">'+es.length+'</div></div><div><small class="mut">最大一筆</small><div style="font-size:20px;font-weight:700">'+fmt(big.amount)+'</div><small class="mut">'+esc(catById(big.catId).name)+(big.sub?'・'+esc(big.sub):'')+(big.note?'・'+esc(big.note):'')+'</small></div></div></div>';
  }
  const ms=trendMonths(),n=ms.length;
  const data=ms.map(k=>{const l=monthEnts(k);return{k,i:sumBy(l,'income'),e:sumBy(l,'expense')}});
  const mx=Math.max(1,...data.map(d=>Math.max(d.i,d.e)));
  const slot=300/n,bw=Math.min(16,slot/2.6);
  let svg='<svg viewBox="0 0 300 140" style="width:100%">';
  data.forEach((d,k)=>{const x=k*slot+(slot-2*bw-2)/2,hi=d.i/mx*100,he=d.e/mx*100;
    svg+='<rect x="'+x+'" y="'+(110-hi)+'" width="'+bw+'" height="'+hi+'" rx="2" fill="var(--inc)"/><rect x="'+(x+bw+2)+'" y="'+(110-he)+'" width="'+bw+'" height="'+he+'" rx="2" fill="var(--exp)"/><text x="'+(x+bw+1)+'" y="126" text-anchor="middle" font-size="9" fill="var(--mut)">'+Number(d.k.split('-')[1])+'月</text>'});
  svg+='</svg>';
  h+='<div class="card"><h3>'+(R.unit==='month'?'近 6 個月收支':'每月收支')+'</h3>'+svg+'<div class="mut" style="text-align:center"><span class="i">■</span> 收入　<span class="e">■</span> 支出</div></div>';
  return h;
}
function setBudget(id,val){

}

}
function setRecSub(v){readRec();RF.sub=v===''?'':((catById(RF.catId).subs||[])[Number(v)]||'')}
function closeRec(){RF=null;$('#modal').innerHTML=''}
function saveRec(){
  readRec();
  const amt=parseFloat(RF.amount),day=parseInt(RF.day,10),name=(RF.name||'').trim();
  if(!name){alert('請輸入名稱');return}
  if(!(amt>0)){alert('請輸入金額');return}
  if(!(day>=1&&day<=31)){alert('日期請填 1 到 31');return}
  if(!RF.catId){alert('請先建立分類');return}
  const o=RF.id?db.recurring.find(x=>x.id===RF.id):{id:uid()};
  Object.assign(o,{type:RF.type,name,amount:amt,catId:RF.catId,sub:RF.sub||'',day,u:Date.now()});delete o.d;
  if(!RF.id)db.recurring.push(o);
  closeRec();persist();
}
function delRec(id){
  const r=db.recurring.find(x=>x.id===id);if(!r||!confirm('刪除固定收支「'+r.name+'」？已記的紀錄會保留。'))return;
  r.d=1;r.u=Date.now();persist();
}

/* ---------- Import / Export ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csvCell=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
function exportCSV(){
  const rows=[['日期','類型','類別','子項目','金額','備註']];
  ents().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push([e.date,e.type==='income'?'收入':'支出',catById(e.catId).name,e.sub||'',e.amount,e.note||'']));
  download('記帳匯出_'+today()+'.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');
}
function exportJSON(){download('記帳備份_'+today()+'.json',ser(db),'application/json')}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
function parseDate(s){
  s=String(s).trim().split(/[ T]/)[0];let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/)))return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;if(a>12){const t=a;a=b;b=t}return y+'-'+p2(a)+'-'+p2(b)}
  return null;
}
const num=s=>parseFloat(String(s||'').replace(/[^\d.\-]/g,''))||0;
function importCSV(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const rows=parseCSV(rd.result);if(rows.length<2){alert('檔案內容為空');return}
    const hd=rows[0].map(x=>x.trim().toLowerCase());
    const ix=(...k)=>hd.findIndex(h=>k.includes(h));
    const iD=ix('date','日期'),iC=ix('category','類別','分類'),iS=ix('子項目','sub'),iN=ix('description','備註','note'),iT=ix('tags'),iTy=ix('類型','type'),iA=ix('金額','amount'),iEx=ix('expense amount'),iIn=ix('income amount');
    if(iD<0||iC<0||(iA<0&&iEx<0)){alert('無法辨識欄位。需要：日期、類別、金額（或 Toshl 的 Expense amount / Income amount）');return}
    const out=[];
    rows.slice(1).forEach(r=>{
      const date=parseDate(r[iD]);if(!date)return;
      let type,amt;
      if(iEx>=0){const ex=num(r[iEx]),inc=iIn>=0?num(r[iIn]):0;if(ex>0){type='expense';amt=ex}else if(inc>0){type='income';amt=inc}else return}
      else{amt=num(r[iA]);const ty=iTy>=0?r[iTy]:'';type=/收入|income/i.test(ty)?'income':'expense';amt=Math.abs(amt);if(!amt)return}
      let note=(iN>=0?r[iN]:'').trim();if(iT>=0&&r[iT])note=(note+' '+r[iT].split(/[,;]/).map(x=>x.trim()).filter(Boolean).map(x=>'#'+x).join(' ')).trim();
      out.push({date,type,amt,cat:(r[iC]||'其他').trim()||'其他',sub:iS>=0?(r[iS]||'').trim():'',note});
    });
    if(!out.length){alert('沒有可匯入的資料');return}
    if(!confirm('找到 '+out.length+' 筆紀錄，匯入？'))return;
    const have=new Set(ents().map(e=>[e.date,e.type,e.amount,catById(e.catId).name,e.sub||'',e.note||''].join('|')));
    let added=0;
    out.forEach(o=>{
      const key=[o.date,o.type,o.amt,o.cat,o.sub,o.note].join('|');if(have.has(key))return;have.add(key);
      let c=cats(o.type).find(x=>x.name===o.cat);
      if(!c){c={id:uid(),name:o.cat,type:o.type,color:PAL[cats().length%PAL.length],subs:[],u:Date.now()};db.categories.push(c)}
      if(o.sub&&!(c.subs||[]).includes(o.sub)){c.subs=c.subs||[];c.subs.push(o.sub);c.u=Date.now()}
      db.entries.push({id:uid(),type:o.type,amount:o.amt,catId:c.id,sub:o.sub,date:o.date,note:o.note,u:Date.now()});added++;
    });
    persist();alert('已匯入 '+added+' 筆（略過重複 '+(out.length-added)+' 筆）');
  };
  rd.readAsText(file,'utf-8');
}
